# =========================================================
# ENVIRONMENT VARIABLES
# =========================================================

x-postgres-shelf-env: &postgres-shelf-env
  POSTGRES_USER: shelf
  POSTGRES_PASSWORD: shelf
  POSTGRES_DB: shelf_db
  POSTGRES_HOST: shelf-db

x-postgres-auth-env: &postgres-auth-env
  POSTGRES_USER: shelf
  POSTGRES_PASSWORD: shelf
  POSTGRES_DB: shelf_db
  POSTGRES_HOST: auth-db

x-shelf-auth-env-base: &shelf-auth-env
  ENV: dev

  DATABASE_URL: postgres://shelf:shelf@auth-db:5432/shelf_db?sslmode=disable

  HTTP_ADDR: ":8080"

  LOG_LEVEL: debug

  JWT_ALG: RS256
  JWT_ISS: shelf-auth
  JWT_AUD: shelf-api

  ACCESS_TTL: 15m

  JWKS_MAX_AGE: 300s

  KEYS_DIR: /run/secrets/keys

  SIGNING_KEY_KID: ${SIGNING_KEY_KID}

  CORS_ORIGINS: http://localhost:3000

  COOKIE_SECURE: false
  COOKIE_SAMESITE: Lax
  COOKIE_DOMAIN:

x-shelf-api-env-base: &shelf-api-env
  DATABASE_URL: postgres://shelf:shelf@shelf-db:5432/shelf_db

  AUTH_JWKS_URL: http://shelf-auth:8080/.well-known/jwks.json

  JWT_ISSUER: shelf-auth
  JWT_AUDIENCE: shelf-api

  JWKS_CACHE_TTL_SECONDS: 300

  SIGNING_KEY_KID: migrate-placeholder # TODO: refactor on API service side to avoid this hack


# =========================================================
# SERVICES
# =========================================================

services:

  # =========================================================
  # FRONTEND
  # =========================================================

  shelf-front:
    image: "${IMAGE}"
    container_name: shelf-front

    build:
      context: .
      target: runtime
      args:
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
        NEXT_PUBLIC_SHELF_API_URL: ${NEXT_PUBLIC_SHELF_API_URL}

    ports:
      - "3000:3000"

    depends_on:
      shelf-auth:
        condition: service_started

      shelf-api:
        condition: service_started

    restart: unless-stopped

    networks:
      - shelf-net


  # =========================================================
  # FRONTEND TEST / LINT
  # =========================================================

  shelf-front-test:
    build:
      context: .
      target: test
      args:
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
        NEXT_PUBLIC_SHELF_API_URL: ${NEXT_PUBLIC_SHELF_API_URL}

    profiles:
      - tools


  # =========================================================
  # AUTH MIGRATIONS
  # =========================================================

  shelf-auth-migrate:
    image: "${AUTH_IMAGE}"
    container_name: shelf-auth-migrate

    environment:
      <<:
        - *postgres-auth-env
        - *shelf-auth-env

    entrypoint: ["migrate"]

    command:
      [
        "-path=/migrations",
        "-database=postgres://shelf:shelf@auth-db:5432/shelf_db?sslmode=disable",
        "up"
      ]

    depends_on:
      auth-db:
        condition: service_healthy

    networks:
      - shelf-net


  # =========================================================
  # AUTH SERVICE
  # =========================================================

  shelf-auth:
    image: "${AUTH_IMAGE}"
    container_name: shelf-auth

    ports:
      - "8081:8080"

    environment:
      <<:
        - *postgres-auth-env
        - *shelf-auth-env

    volumes:
      - ./devkeys:/run/secrets/keys:ro

    depends_on:
      auth-db:
        condition: service_healthy

      shelf-auth-migrate:
        condition: service_completed_successfully

    restart: unless-stopped

    networks:
      - shelf-net


  # =========================================================
  # SHELF API MIGRATIONS
  # =========================================================

  shelf-api-migrate:
    image: "${SHELF_API_IMAGE}"
    container_name: shelf-api-migrate

    entrypoint: ["alembic"]

    command: upgrade head

    environment:
      <<:
        - *postgres-shelf-env
        - *shelf-api-env

    depends_on:
      shelf-db:
        condition: service_healthy

    networks:
      - shelf-net


  # =========================================================
  # SHELF API
  # =========================================================

  shelf-api:
    image: "${SHELF_API_IMAGE}"
    container_name: shelf-api

    command: uvicorn shelf.app.main:app --host 0.0.0.0 --port 8082 --reload

    ports:
      - "8082:8082"

    environment:
      <<:
        - *postgres-shelf-env
        - *shelf-api-env

    depends_on:
      shelf-db:
        condition: service_healthy

      shelf-api-migrate:
        condition: service_completed_successfully

      shelf-auth:
        condition: service_started

    restart: unless-stopped

    networks:
      - shelf-net


  # =========================================================
  # AUTH DATABASE
  # =========================================================

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db

    environment:
      <<: *postgres-auth-env

    ports:
      - "5433:5432"

    volumes:
      - auth-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf_db"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - shelf-net


  # =========================================================
  # SHELF DATABASE
  # =========================================================

  shelf-db:
    image: postgres:16-alpine
    container_name: shelf-db

    environment:
      <<: *postgres-shelf-env

    ports:
      - "5434:5432"

    volumes:
      - shelf-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf_db"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    networks:
      - shelf-net


# =========================================================
# NETWORKS
# =========================================================

networks:
  shelf-net:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================

volumes:
  auth-db-data:
  shelf-db-data:
